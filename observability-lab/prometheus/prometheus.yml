global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: cloudwatch-log-metrics
    metrics_path: /metrics
    static_configs:
      - targets:
          - cloudwatch-log-metrics:9108

  # YACE — CloudWatch service metrics (RDS/SQS/Lambda/ALB via tag discovery).
  - job_name: yace
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets:
          - yace:5000


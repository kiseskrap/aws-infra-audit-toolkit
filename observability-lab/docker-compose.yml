services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - cloudwatch-log-metrics

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  cloudwatch-log-metrics:
    build:
      context: ./exporters
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-2}
      EXPORTER_CONFIG: /app/config.json
      EXPORTER_PORT: "9108"
    ports:
      - "9108:9108"
    volumes:
      - ~/.aws:/root/.aws:ro
      - ./exporters/config.local.json:/app/config.json:ro

  # YACE — Yet Another CloudWatch Exporter.
  # Pulls CloudWatch service metrics (RDS, SQS, Lambda, ALB) discovered
  # via tag-based enumeration. Complements cloudwatch-log-metrics, which
  # only handles log-derived counters. See docs/point-at-real-aws.md.
  #
  # Uses --scraping-interval to match Prometheus scrape_interval.
  # If yace-config.local.yaml is missing, the container will exit at
  # startup; run `cp exporters/yace-config.example.yaml exporters/yace-config.local.yaml`.
  yace:
    image: ghcr.io/nerdswords/yet-another-cloudwatch-exporter:v0.61.2
    command:
      - "--config.file=/tmp/config.yml"
      - "--scraping-interval=60"
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-2}
    ports:
      # host 5001 → container 5000 (macOS uses 5000 for AirPlay)
      - "5001:5000"
    volumes:
      - ~/.aws:/exporter/.aws:ro
      - ./exporters/yace-config.local.yaml:/tmp/config.yml:ro

  # Prometheus Pushgateway — receives short-lived job metrics from CI or
  # deploy hooks. In this lab we use it to record "deploy events" so
  # Grafana can annotate the dashboards with a vertical line at each
  # deployment. See docs/deployment-annotations.md.
  pushgateway:
    image: prom/pushgateway:v1.10.0
    ports:
      - "9091:9091"

volumes:
  prometheus-data:
  grafana-data:

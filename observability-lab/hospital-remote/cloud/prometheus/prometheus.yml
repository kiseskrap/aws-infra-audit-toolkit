# Cloud-side Prometheus — receives remote-write from hospital OTel Collector.
#
# In production this is replaced by a managed service
# (Grafana Cloud, AWS Managed Prometheus, Mimir, Cortex).
# The local container here just proves the pipeline works end-to-end.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    tenant: hospital-remote-lab

# Accept out-of-order samples up to 10 minutes stale.
# Required for backfill after a WAN outage: the collector's sending_queue
# replays samples with timestamps from before the outage recovered.
# See docs/offline-behavior.md.
storage:
  tsdb:
    out_of_order_time_window: 10m

# Prometheus itself does not need to scrape anything in this scenario:
# the hospital OTel Collector pushes samples in via remote-write.
scrape_configs:
  - job_name: prometheus-self
    static_configs:
      - targets:
          - localhost:9090

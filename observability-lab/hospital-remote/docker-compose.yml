# hospital-remote — end-to-end simulation of an on-prem hospital service
# forwarding aggregated, PHI-free metrics to a remote cloud backend.
#
# Two logical zones, one docker network:
#   - on-prem:  vitalcare-mock + otel-collector
#   - cloud:    prometheus (remote-write receiver) + grafana
#
# In production these two zones are separated by a hospital firewall
# with a single outbound HTTPS endpoint (see docs/network-boundary.md).

services:

  # ---------- Hospital A on-prem ----------

  vitalcare-mock:
    build:
      context: ./on-prem/vitalcare-mock
    container_name: hospital-a-vitalcare-mock
    environment:
      HOSPITAL_ID: hospital-a-seoul-general
      WARD_ID: icu-a
      SERVICE_VERSION: 1.0.0
      # Contract tier drives which feature flags advertise as "on".
      CONTRACT_TIER: enterprise
    ports:
      # Exposed only for local exploration. In a hospital, this would
      # be reachable only from the on-prem management network.
      - "8081:8080"
    networks:
      - lab

  otel-collector:
    # 0.115+ is needed for prometheusremotewrite exporter's sending_queue.
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: hospital-a-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./on-prem/otel-collector/config.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - vitalcare-mock
      - cloud-prometheus
    networks:
      - lab

  # ---------- Hospital B on-prem (multi-tenant demo) ----------
  # Different hospital_id, different ward, different contract tier so
  # the aggregate dashboards can show tenant-level differences.

  vitalcare-mock-b:
    build:
      context: ./on-prem/vitalcare-mock
    container_name: hospital-b-vitalcare-mock
    environment:
      HOSPITAL_ID: hospital-b-busan-medical
      WARD_ID: er-1
      SERVICE_VERSION: 1.0.0
      CONTRACT_TIER: standard
    ports:
      - "8082:8080"
    networks:
      - lab

  otel-collector-b:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: hospital-b-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      # Same collector config — the mock's own labels distinguish the tenant.
      - ./on-prem/otel-collector/config.b.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - vitalcare-mock-b
      - cloud-prometheus
    networks:
      - lab

  # ---------- Cloud backend ----------

  cloud-prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cloud-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=6h"
      # OTLP receiver at /api/v1/otlp/v1/metrics — the collector's
      # otlphttp exporter writes here so we can use its sending_queue for
      # WAN outage buffering. See docs/offline-behavior.md.
      # v2.53 gates it behind a feature flag; v2.55+ has a stable
      # --web.enable-otlp-receiver flag.
      - "--enable-feature=otlp-write-receiver"
      # Keep remote-write enabled for the parent lab's compatibility.
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./cloud/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    networks:
      - lab

  grafana:
    image: grafana/grafana:11.1.0
    container_name: cloud-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./cloud/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./cloud/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - cloud-prometheus
    networks:
      - lab

networks:
  lab:
    driver: bridge
